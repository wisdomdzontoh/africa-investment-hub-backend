name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aih
          POSTGRES_PASSWORD: aih_password
          POSTGRES_DB: aih
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aih"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DIRECT_HOST: localhost
      POSTGRES_DIRECT_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      TEST_DATABASE_URL: postgresql+asyncpg://aih:aih_password@localhost:5432/aih_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libcairo2 libffi8

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy app

      - name: Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Pytest (with coverage gate)
        run: pytest
