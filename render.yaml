# Render Blueprint for the African Investment Hub backend — $0/month shape:
#   aih-api   — free web service (Docker): runs Alembic migrations, the ARQ
#               worker (RUN_WORKER=true), and the API in one container
#   aih-redis — free managed Key Value (rate limiting, caches, ARQ queue)
# PostgreSQL lives on Neon (free): paste its connection string as
# DATABASE_URL when the blueprint prompts for it.
#
# Free-tier caveats: the web service spins down after 15 min idle (~50 s cold
# start) and the bundled worker/crons only run while it is awake. When that
# stops being acceptable: move aih-api to `plan: starter`, or split the worker
# into its own `type: worker` service (command:
# `arq app.workers.worker.WorkerSettings`, RUN_WORKER=false here).
#
# Deploy: Render Dashboard → New + → Blueprint → select this repo.
# Full walkthrough: docs/DEPLOY_RENDER_NEON.md in the project docs.

previews:
  generation: off

services:
  # ── Redis ──────────────────────────────────────────────────────────────
  - type: keyvalue
    name: aih-redis
    plan: free # 25 MB, no persistence — upgrade before real traffic
    region: frankfurt
    ipAllowList: [] # internal-only access
    maxmemoryPolicy: noeviction # queued ARQ jobs must never be evicted

  # ── FastAPI web service (+ bundled ARQ worker) ─────────────────────────
  - type: web
    name: aih-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /v1/health
    dockerCommand: sh start.sh
    autoDeploy: true
    envVars:
      - key: RUN_WORKER
        value: "true"
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: aih-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: aih-redis
          property: port
      # ── App ──
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false # comma-separated, e.g. https://your-app.vercel.app
      - key: SECRET_KEY
        generateValue: true
      # ── Neon PostgreSQL — one full connection string, used by both the
      #    app and Alembic. Paste the UNPOOLED string (host without
      #    "-pooler"); sslmode/channel_binding params are handled.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      # ── Field-level encryption (AES-256-GCM) ──
      # python -c "import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # ── Clerk ──
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # ── OpenAI ──
      - key: OPENAI_API_KEY
        sync: false
      # ── Cloudflare R2 ──
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # ── Resend ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_ADMIN_INBOX
        sync: false
