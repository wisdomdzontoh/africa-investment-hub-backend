[project]
name = "african-investment-hub-backend"
version = "0.1.0"
description = "African Investment Hub — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    # Validation / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Cache / queue
    "redis>=5.1.0",
    "arq>=0.26.0",
    # Auth / security
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "svix>=1.34.0",
    # HTTP / external services
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "resend>=2.4.0",
    "openai>=1.54.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.53.0",
    # Observability
    "sentry-sdk[fastapi]>=2.17.0",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    # PDF (Phase 2, installed now)
    "weasyprint>=62.3",
    # Utils
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.25.0",
    "factory-boy>=3.3.0",
    "pre-commit>=4.0.0",
    "types-boto3>=1.0.2",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ─────────────────────────── Ruff ───────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "ASYNC",             # async correctness
    "S",                 # bandit security
    "RUF",
]
ignore = [
    "S101",   # asserts (used in tests)
    "B008",   # function call in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"alembic/**" = ["N999", "E501"]

# ─────────────────────────── Mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

# ────────────────────────── Pytest ──────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: integration tests that hit the database",
    "unit: pure unit tests",
]

[tool.coverage.run]
source = ["app"]
# Omit thin external-SDK adapters / process entrypoints. These are integration
# glue (OpenAI, ARQ, Sentry) exercised via stubs, not business logic, and are
# verified manually / in staging rather than unit-tested.
omit = [
    "alembic/*",
    "app/workers/worker.py",
    "app/workers/tasks.py",
    "app/workers/queue.py",
    "app/services/ai/client.py",
    "app/core/sentry.py",
    "app/core/metrics.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
