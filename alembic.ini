# Alembic configuration. The database URL is injected at runtime from
# app settings (see alembic/env.py) — not hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Use a timestamp + slug for revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# No post-write hooks: the runtime image has no dev tooling (ruff). Format
# generated migrations manually with `ruff` in your dev environment if desired.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
